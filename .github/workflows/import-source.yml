name: Import Reviewed Node Source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
permissions:
  contents: write
concurrency:
  group: ip233-reviewed-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'liuhang01/ComfyUI-IP233-API' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import reviewed source
        shell: bash
        run: |
          python3 - <<'PY'
          EXPECTED_SHA256 = '84cef98d7f56cc344020ba00fd9ca6bdd3c22f43c8f1b32c2a1fe944ceb82441'
          EXPECTED_FILES = ['.github/workflows/publish.yml', '.github/workflows/test.yml', '.gitignore', 'LICENSE', 'MANIFEST.in', 'NOTICE', 'README.md', '__init__.py', 'docs/PUBLISHING.md', 'docs/VALIDATION.md', 'examples/api/image_edit.json', 'examples/api/image_generate.json', 'examples/api/video_generate.json', 'examples/api/video_resume.json', 'examples/workflows/image_edit.json', 'examples/workflows/image_generate.json', 'examples/workflows/video_generate.json', 'examples/workflows/video_resume.json', 'ip233.local.example.json', 'ip233/__init__.py', 'ip233/catalog.py', 'ip233/catalog.snapshot.json', 'ip233/client.py', 'ip233/media.py', 'ip233/nodes.py', 'ip233/tasks.py', 'pyproject.toml', 'requirements.txt', 'tests/conftest.py', 'tests/test_catalog.py', 'tests/test_client.py', 'tests/test_media.py', 'tests/test_nodes.py', 'tests/test_release_tools.py', 'tests/test_tasks.py', 'tools/build_examples.py', 'tools/check_release.py', 'tools/package_release.py', 'tools/prepare_release.py', 'tools/refresh_catalog.py', 'tools/submit_manager.py']
          """Restore reviewed source bytes without changing existing workflows."""
          import base64
          import hashlib
          import io
          from pathlib import Path, PurePosixPath
          import subprocess
          import zipfile

          PREFIX = "ComfyUI-IP233-API"
          WORKFLOW_PATHS = {".github/workflows/test.yml", ".github/workflows/publish.yml"}
          IMPORT_PATH = ".github/workflows/import-source.yml"


          def restore_sources(root, archive_bytes, expected_sha256, expected_files):
              if hashlib.sha256(archive_bytes).hexdigest() != expected_sha256:
                  raise RuntimeError("Source archive digest mismatch.")
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  names = archive.namelist()
                  if len(names) != len(set(names)) or len(names) != 41:
                      raise RuntimeError("Unexpected source archive members.")
                  entries = {}
                  for name in names:
                      source = PurePosixPath(name)
                      if source.is_absolute() or ".." in source.parts or source.parts[0] != PREFIX:
                          raise RuntimeError("Unsafe source archive path.")
                      relative = source.relative_to(PREFIX).as_posix()
                      entries[relative] = archive.read(name)
                  if sorted(entries) != sorted(expected_files):
                      raise RuntimeError("Source file manifest mismatch.")
                  for relative in WORKFLOW_PATHS:
                      target = root / relative
                      if not target.is_file() or target.read_bytes() != entries[relative]:
                          raise RuntimeError("Create the two reviewed CI workflows before importing source.")
                  restored = []
                  for relative, content in entries.items():
                      if relative in WORKFLOW_PATHS:
                          continue
                      target = root / relative
                      if target.exists():
                          raise RuntimeError("Refusing to overwrite an existing source file: " + relative)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(content)
                      restored.append(relative)
                  return restored


          def publish_source():
              root = Path.cwd()
              if (root / "__init__.py").exists():
                  print("Source is already present; no files will be overwritten.")
                  return
              tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
              if tracked != WORKFLOW_PATHS | {IMPORT_PATH}:
                  raise RuntimeError("Unexpected repository contents; refusing to overwrite existing work.")
              workflow = (root / IMPORT_PATH).read_text(encoding="utf-8")
              start = workflow.index("# SOURCE_ARCHIVE_BEGIN\n") + len("# SOURCE_ARCHIVE_BEGIN\n")
              end = workflow.index("# SOURCE_ARCHIVE_END", start)
              encoded = "".join(line.removeprefix("# ") for line in workflow[start:end].splitlines())
              archive_bytes = base64.b64decode(encoded, validate=True)
              restored = restore_sources(root, archive_bytes, EXPECTED_SHA256, EXPECTED_FILES)
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", "--", *restored], check=True)
              staged = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
              if staged != set(restored):
                  raise RuntimeError("Staged files do not match the reviewed source manifest.")
              subprocess.run(["git", "commit", "-m", "Import reviewed IP233 node source"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              print(f"Published {len(restored)} source files; preserved both reviewed CI workflows.")


          if __name__ == "__main__":
              publish_source()
          PY

